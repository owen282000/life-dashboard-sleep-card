name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  # Used at the branch its documentation names: HACS moves the checks with each release, and
  # a pinned commit would validate against rules that no longer apply.
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@main
        with:
          category: plugin

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --version
      - run: npm test
